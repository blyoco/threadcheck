name: Release

# Nieuw versienummer in threads-activity-filter/manifest.json op main betekent automatisch:
# Firefox-versie laten ondertekenen door Mozilla, GitHub-release maken en updates.json bijwerken.
on:
  push:
    branches: [main]
    paths: ['threads-activity-filter/**']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
      release: ${{ steps.check.outputs.release }}
    steps:
      - uses: actions/checkout@v5
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
          AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
          AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: |
          VERSION=$(python3 -c "import json;print(json.load(open('threads-activity-filter/manifest.json'))['version'])")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "Release v$VERSION bestaat al; verhoog het versienummer voor een nieuwe release."
          elif [ -z "$AMO_JWT_ISSUER" ] || [ -z "$AMO_JWT_SECRET" ]; then
            echo "::warning::Release v$VERSION overgeslagen: zet de repository secrets AMO_JWT_ISSUER en AMO_JWT_SECRET (zie README) en start deze workflow opnieuw."
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

  release:
    needs: check
    if: needs.check.outputs.release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VERSION: ${{ needs.check.outputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5

      - name: Bouwen
        run: |
          python3 bouw.py
          mkdir -p build/firefox
          unzip -q "dist/threads-activity-filter-firefox-$VERSION.zip" -d build/firefox

      - name: Ondertekenen bij Mozilla (niet openbaar)
        env:
          AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
          AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: |
          npx --yes web-ext@8 sign --channel unlisted --source-dir build/firefox --artifacts-dir signed \
            --api-key "$AMO_JWT_ISSUER" --api-secret "$AMO_JWT_SECRET"
          cp signed/*.xpi threadcheck-firefox.xpi
          cp "dist/threads-activity-filter-chrome-$VERSION.zip" threadcheck-chrome.zip

      - name: GitHub-release maken
        run: |
          gh release create "v$VERSION" threadcheck-firefox.xpi threadcheck-chrome.zip \
            --title "threadcheck $VERSION" \
            --notes "**Firefox (pc en Android):** installeer \`threadcheck-firefox.xpi\`. Daarna werkt hij zichzelf automatisch bij.
          **Chrome:** pak \`threadcheck-chrome.zip\` uit en laad de map via chrome://extensions → Ontwikkelaarsmodus → Uitgepakte extensie laden."

      # Pas na de release, zodat de link in updates.json meteen werkt als Firefox hem ziet.
      - name: updates.json bijwerken
        run: |
          python3 bouw.py updates threadcheck-firefox.xpi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add updates.json
          git commit -m "updates.json: v$VERSION"
          git pull --rebase
          git push
