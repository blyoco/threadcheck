name: Release

# A new version number in threads-activity-filter/manifest.json on main automatically:
# has the Firefox version signed by Mozilla, creates a GitHub release and updates updates.json.
on:
  push:
    branches: [main]
    paths: ['threads-activity-filter/**']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
      release: ${{ steps.check.outputs.release }}
    steps:
      - uses: actions/checkout@v5
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
          AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
          AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: |
          VERSION=$(python3 -c "import json;print(json.load(open('threads-activity-filter/manifest.json'))['version'])")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "Release v$VERSION already exists; increase the version number to make a new release."
          elif [ -z "$AMO_JWT_ISSUER" ] || [ -z "$AMO_JWT_SECRET" ]; then
            echo "::warning::Release v$VERSION skipped: add the repository secrets AMO_JWT_ISSUER and AMO_JWT_SECRET (see README) and run this workflow again."
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

  release:
    needs: check
    if: needs.check.outputs.release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VERSION: ${{ needs.check.outputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5

      - name: Build
        run: |
          python3 bouw.py
          mkdir -p build/firefox
          unzip -q "dist/threads-activity-filter-firefox-$VERSION.zip" -d build/firefox

      - name: Sign with Mozilla (unlisted)
        env:
          AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
          AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: |
          npx --yes web-ext@8 sign --channel unlisted --source-dir build/firefox --artifacts-dir signed \
            --api-key "$AMO_JWT_ISSUER" --api-secret "$AMO_JWT_SECRET"
          cp signed/*.xpi threadcheck-firefox.xpi
          cp "dist/threads-activity-filter-chrome-$VERSION.zip" threadcheck-chrome.zip

      - name: Create GitHub release
        run: |
          gh release create "v$VERSION" threadcheck-firefox.xpi threadcheck-chrome.zip \
            --title "threadcheck $VERSION" \
            --notes "**How to install:** follow the simple step-by-step guide at https://github.com/blyoco/threadcheck#before-you-start

          - **Android phone or computer with Firefox:** use \`threadcheck-firefox.xpi\`. It updates itself automatically.
          - **Computer with Chrome:** use \`threadcheck-chrome.zip\`.
          - **iPhone / iPad:** not possible."

      # Only after the release, so the link in updates.json works as soon as Firefox sees it.
      - name: Update updates.json
        run: |
          python3 bouw.py updates threadcheck-firefox.xpi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add updates.json
          git commit -m "updates.json: v$VERSION"
          git pull --rebase
          git push
